<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Percentage Calculator</title>

```
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .calculator {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    h2 {
        text-align: center;
        margin: 0 0 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 7px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 16px;
    }

    .result {
        margin-top: 25px;
        padding: 18px;
        background: #f7f7f7;
        border-radius: 10px;
    }

    .result p {
        margin: 12px 0;
        font-size: 17px;
    }

    #category {
        font-size: 22px;
        font-weight: bold;
    }
</style>
```

</head>

<body>

<div class="calculator">

```
<h2>Percentage Calculator</h2>

<label for="upper">Upper Value</label>
<input
    type="number"
    id="upper"
    placeholder="Enter Upper Value"
    oninput="calculate()"
>

<label for="lower">Lower Value</label>
<input
    type="number"
    id="lower"
    placeholder="Enter Lower Value"
    oninput="calculate()"
>

<label for="raised">Raised / Particular Amount</label>
<input
    type="number"
    id="raised"
    placeholder="Enter Raised Amount"
    oninput="calculate()"
>

<div class="result">

    <p>
        Less Amount:
        <strong id="lessAmount">-</strong>
    </p>

    <p>
        Percentage:
        <strong id="percentage">-</strong>
    </p>

    <p>
        Result:
        <strong id="category">-</strong>
    </p>

</div>
```

</div>

<script>
function calculate() {

    const upper = parseFloat(document.getElementById("upper").value);
    const lower = parseFloat(document.getElementById("lower").value);
    const raised = parseFloat(document.getElementById("raised").value);

    const lessAmountElement = document.getElementById("lessAmount");
    const percentageElement = document.getElementById("percentage");
    const categoryElement = document.getElementById("category");

    // Jab tak teeno values nahi bhari hain
    if (
        Number.isNaN(upper) ||
        Number.isNaN(lower) ||
        Number.isNaN(raised)
    ) {
        lessAmountElement.textContent = "-";
        percentageElement.textContent = "-";
        categoryElement.textContent = "-";
        return;
    }

    // Raised amount zero nahi ho sakta
    if (raised === 0) {
        lessAmountElement.textContent = "-";
        percentageElement.textContent = "Cannot calculate";
        categoryElement.textContent = "-";
        return;
    }

    // Upper - Lower
    const lessAmount = upper - lower;

    // Less Amount / Raised Amount × 100
    const percentage = (lessAmount / raised) * 100;

    let category;

    if (percentage <= 15) {
        category = "High";
    } else if (percentage <= 50) {
        category = "Medium";
    } else {
        category = "Low";
    }

    lessAmountElement.textContent = lessAmount.toFixed(2);

    percentageElement.textContent =
        percentage.toFixed(2) + "%";

    categoryElement.textContent = category;
}
</script>

</body>
</html>
