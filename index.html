<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .calculator {
        width: 100%;
        max-width: 420px;
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    h2 {
        text-align: center;
        margin: 0 0 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-top: 7px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 25px;
        border: none;
        border-radius: 7px;
        background: #222;
        color: white;
        font-size: 17px;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    .result {
        margin-top: 25px;
        padding: 18px;
        background: #f7f7f7;
        border-radius: 10px;
    }

    .result p {
        margin: 12px 0;
        font-size: 17px;
    }

    #category {
        font-size: 22px;
        font-weight: bold;
    }
</style>

</head>

<body>

```
<div class="calculator">

    <h2>Percentage Calculator</h2>

    <label for="upper">Upper Value</label>
    <input
        type="number"
        id="upper"
        placeholder="Enter Upper Value"
    >

    <label for="lower">Lower Value</label>
    <input
        type="number"
        id="lower"
        placeholder="Enter Lower Value"
    >

    <label for="raised">Raised / Particular Amount</label>
    <input
        type="number"
        id="raised"
        placeholder="Enter Raised Amount"
    >

    <button type="button" onclick="calculate()">
        Calculate
    </button>

    <div class="result">

        <p>
            Less Amount:
            <strong id="lessAmount">-</strong>
        </p>

        <p>
            Percentage:
            <strong id="percentage">-</strong>
        </p>

        <p>
            Result:
            <strong id="category">-</strong>
        </p>

    </div>

</div>

<script>
    function calculate() {

        const upperInput = document.getElementById("upper");
        const lowerInput = document.getElementById("lower");
        const raisedInput = document.getElementById("raised");

        const upper = parseFloat(upperInput.value);
        const lower = parseFloat(lowerInput.value);
        const raised = parseFloat(raisedInput.value);

        if (
            Number.isNaN(upper) ||
            Number.isNaN(lower) ||
            Number.isNaN(raised)
        ) {
            alert("Please enter all three values.");
            return;
        }

        if (raised === 0) {
            alert("Raised Amount cannot be zero.");
            return;
        }

        const lessAmount = upper - lower;

        const percentage = (lessAmount / raised) * 100;

        let category;

        if (percentage <= 15) {
            category = "High";
        } else if (percentage <= 50) {
            category = "Medium";
        } else {
            category = "Low";
        }

        document.getElementById("lessAmount").textContent =
            lessAmount.toFixed(2);

        document.getElementById("percentage").textContent =
            percentage.toFixed(2) + "%";

        document.getElementById("category").textContent =
            category;
    }
</script>
